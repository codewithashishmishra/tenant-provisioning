[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-provisioning"
version = "0.1.0"
description = "Control plane for async tenant provisioning"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pika>=1.3,<2",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7",
    "bandit>=1.8",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests"]
# B104: the process binds 0.0.0.0 so the published container port works.
skips = ["B104"]
